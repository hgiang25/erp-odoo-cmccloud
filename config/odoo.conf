[options]
; Đường dẫn đến các thư mục addons (gồm addons tiêu chuẩn và base addons của Odoo)
addons_path = /workspace/addons,/workspace/odoo/addons

; Thư mục lưu trữ filestore (tệp đính kèm, ảnh sản phẩm, session)
data_dir = /var/lib/odoo

; Master password dùng để tạo, xóa, sao lưu (backup) database trên giao diện /web/database/manager
admin_passwd = admin_secret_key_123

; Thông tin kết nối PostgreSQL (khớp với service db trong docker-compose.yml)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

; Network Interface
http_interface = 0.0.0.0
http_port = 8069

; Giới hạn thời gian và tài nguyên tránh timeout khi cài đặt module nặng
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Log settings
log_level = info
list_db = True
