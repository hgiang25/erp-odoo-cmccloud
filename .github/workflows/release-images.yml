name: Build images and promote GitOps

on:
  push:
    branches: [main]
    paths:
    - 'docker/**'
    - 'odoo/**'
    - 'addons/**'
    - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-cmc-image-release
  cancel-in-progress: false

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Odoo image
      uses: docker/build-push-action@v6
      with:
        context: docker/odoo
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-queue:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=odoo
        cache-to: type=gha,mode=max,scope=odoo

    - name: Build and push backup image
      uses: docker/build-push-action@v6
      with:
        context: docker/backup
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-backup:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup

    - name: Clone GitOps Repo
      uses: actions/checkout@v4
      with:
        repository: hgiang25/odoo-cmc-gitops
        token: ${{ secrets.GITOPS_PAT }}
        path: gitops-repo

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Update desired image versions in GitOps repo
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        python -m pip install -r gitops-repo/requirements-tools.txt
        python gitops-repo/gitops/update_images.py --username "$DOCKERHUB_USERNAME" --tag "$IMAGE_TAG" --file gitops-repo/overlays/cmc/kustomization.yaml

    - name: Commit and Push to GitOps repository
      run: |
        cd gitops-repo
        if git diff --quiet -- overlays/cmc/kustomization.yaml; then
          echo "Desired images already use $IMAGE_TAG"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add overlays/cmc/kustomization.yaml
        git commit -m "chore(gitops): promote Odoo images to $IMAGE_TAG from erp-odoo-cmccloud@${{ github.sha }}"
        git push origin main
