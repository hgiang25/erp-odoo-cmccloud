name: CI images and GitOps promotion

on:
  pull_request:
    branches: [main]
    paths:
    - 'docker/**'
    - 'odoo/**'
    - 'addons/**'
    - 'requirements.txt'
    - '.github/workflows/release-images.yml'
  push:
    branches: [main]
    paths:
    - 'docker/**'
    - 'odoo/**'
    - 'addons/**'
    - 'requirements.txt'
    - '.github/workflows/release-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-cmc-image-release
  cancel-in-progress: false

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  quality:
    name: Validate application release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Compile release helpers
      run: python -m compileall -q docker
    - name: Validate local Compose definition
      run: docker compose config --quiet

  publish:
    name: Build, smoke-test and publish immutable images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Odoo image from this repository source
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/odoo/Dockerfile
        load: true
        push: false
        tags: local/odoo-queue:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=odoo
        cache-to: type=gha,mode=max,scope=odoo

    - name: Build backup image with CMC S3 support
      uses: docker/build-push-action@v6
      with:
        context: docker/backup
        load: true
        push: false
        tags: local/odoo-backup:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup

    - name: Smoke-test image contents before publishing
      env:
        ODOO_IMAGE: local/odoo-queue:${{ env.IMAGE_TAG }}
        BACKUP_IMAGE: local/odoo-backup:${{ env.IMAGE_TAG }}
      run: |
        docker run --rm --entrypoint python3 "$ODOO_IMAGE" -c "import pathlib, odoo; p=pathlib.Path(odoo.__file__).resolve(); print(p); assert str(p).startswith('/opt/odoo-src/')"
        docker run --rm --entrypoint python3 "$BACKUP_IMAGE" -c "import boto3; print(boto3.__version__)"

    - name: Publish both images only after smoke tests pass
      if: github.event_name != 'pull_request'
      env:
        ODOO_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-queue:${{ env.IMAGE_TAG }}
        BACKUP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-backup:${{ env.IMAGE_TAG }}
      run: |
        docker tag "local/odoo-queue:$IMAGE_TAG" "$ODOO_IMAGE"
        docker tag "local/odoo-backup:$IMAGE_TAG" "$BACKUP_IMAGE"
        docker push "$ODOO_IMAGE"
        docker push "$BACKUP_IMAGE"

  promote:
    name: Commit desired versions to GitOps
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout GitOps source of truth
      uses: actions/checkout@v4
      with:
        repository: hgiang25/odoo-cmc-gitops
        token: ${{ secrets.GITOPS_PAT }}
        path: gitops-repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: gitops-repo/requirements-tools.txt
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.32.7

    - name: Update and validate desired state
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        python -m pip install -r gitops-repo/requirements-tools.txt
        python gitops-repo/scripts/update_images.py --username "$DOCKERHUB_USERNAME" --tag "$IMAGE_TAG" --file gitops-repo/overlays/cmc/kustomization.yaml
        python gitops-repo/validate.py
        kubectl kustomize gitops-repo/overlays/cmc >/dev/null

    - name: Commit and push the promotion
      working-directory: gitops-repo
      run: |
        if git diff --quiet -- overlays/cmc/kustomization.yaml; then
          echo "Desired images already use $IMAGE_TAG"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add overlays/cmc/kustomization.yaml
        git commit -m "chore(gitops): promote Odoo images to $IMAGE_TAG from erp-odoo-cmccloud@${{ github.sha }}"
        git push origin HEAD:main
    - name: Request live CMC verification after promotion
      if: vars.CMC_AUTO_VERIFY == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITOPS_PAT }}
      run: |
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/hgiang25/odoo-cmc-gitops/dispatches \
          --data "{\"event_type\":\"verify-release\",\"client_payload\":{\"image_tag\":\"$IMAGE_TAG\"}}"
