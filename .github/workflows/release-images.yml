name: Build images and promote GitOps

on:
  push:
    branches: [main]
    paths:
    - 'k8s/image/**'
    - 'k8s/backup/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odoo-cmc-image-release
  cancel-in-progress: false

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.32.7
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push Odoo image
      uses: docker/build-push-action@v6
      with:
        context: k8s/image
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-queue:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=odoo
        cache-to: type=gha,mode=max,scope=odoo
    - name: Build and push backup image
      uses: docker/build-push-action@v6
      with:
        context: k8s/backup
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-backup:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Update desired image versions
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        python -m pip install -r k8s/requirements-tools.txt
        python k8s/gitops/update_images.py --username "$DOCKERHUB_USERNAME" --tag "$IMAGE_TAG"
        kubectl kustomize k8s/overlays/cmc > /tmp/odoo-cmc.yaml
    - name: Commit the GitOps promotion
      run: |
        if git diff --quiet -- k8s/overlays/cmc/kustomization.yaml; then
          echo "Desired images already use $IMAGE_TAG"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add k8s/overlays/cmc/kustomization.yaml
        git commit -m "chore(gitops): promote Odoo images to $IMAGE_TAG"
        git push origin HEAD:main
