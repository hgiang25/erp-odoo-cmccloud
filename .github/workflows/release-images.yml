name: CI images and GitOps promotion

on:
  pull_request:
    branches: [main]
    paths:
    - 'docker/**'
    - 'odoo/**'
    - 'addons/**'
    - 'requirements.txt'
    - '.github/workflows/release-images.yml'
  push:
    branches: [main]
    paths:
    - 'docker/**'
    - 'odoo/**'
    - 'addons/**'
    - 'requirements.txt'
    - '.github/workflows/release-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-cmc-image-release
  cancel-in-progress: false

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  quality:
    name: Validate application release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Compile release helpers
      run: python -m compileall -q docker
    - name: Validate local Compose definition
      run: docker compose config --quiet

  publish:
    name: Build, smoke-test and publish immutable images
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Refuse stale manual reruns before publishing
      if: github.event_name != 'pull_request'
      run: |
        set -euo pipefail
        latest="$(git ls-remote origin refs/heads/main | cut -f1)"
        if [ "$latest" != "$GITHUB_SHA" ]; then
          echo 'This source commit is no longer main. Start a new workflow run on main.' >&2
          exit 1
        fi
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Odoo image from this repository source
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/odoo/Dockerfile
        load: true
        push: false
        tags: local/odoo-queue:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=odoo
        cache-to: type=gha,mode=max,scope=odoo

    - name: Build backup image with CMC S3 support
      uses: docker/build-push-action@v6
      with:
        context: docker/backup
        load: true
        push: false
        tags: local/odoo-backup:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup

    - name: Smoke-test image contents before publishing
      env:
        ODOO_IMAGE: local/odoo-queue:${{ env.IMAGE_TAG }}
        BACKUP_IMAGE: local/odoo-backup:${{ env.IMAGE_TAG }}
      run: |
        docker run --rm --entrypoint python3 "$ODOO_IMAGE" -c "import pathlib, odoo; p=pathlib.Path(odoo.__file__).resolve(); print(p); assert str(p).startswith('/opt/odoo-src/')"
        docker run --rm --entrypoint python3 "$BACKUP_IMAGE" -c "import boto3; print(boto3.__version__)"

    - name: Publish both images only after smoke tests pass
      if: github.event_name != 'pull_request'
      env:
        ODOO_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-queue:${{ env.IMAGE_TAG }}
        BACKUP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/odoo-backup:${{ env.IMAGE_TAG }}
      run: |
        set -euo pipefail
        publish_once() {
          local local_image="$1" remote_image="$2"
          local error_file
          error_file="$(mktemp)"
          if docker manifest inspect "$remote_image" > /dev/null 2> "$error_file"; then
            echo "Reusing existing immutable tag: $remote_image"
          elif grep -Eiq 'manifest unknown|no such manifest' "$error_file"; then
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
          else
            cat "$error_file" >&2
            rm -f "$error_file"
            return 1
          fi
          rm -f "$error_file"
          docker pull "$remote_image"
        }
        publish_once "local/odoo-queue:$IMAGE_TAG" "$ODOO_IMAGE"
        publish_once "local/odoo-backup:$IMAGE_TAG" "$BACKUP_IMAGE"
        docker run --rm --entrypoint python3 "$ODOO_IMAGE" -c "import pathlib, odoo; assert str(pathlib.Path(odoo.__file__).resolve()).startswith('/opt/odoo-src/')"
        docker run --rm --entrypoint python3 "$BACKUP_IMAGE" -c 'import boto3'

  promote:
    name: Commit desired Dev versions to GitOps
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout GitOps source of truth
      uses: actions/checkout@v4
      with:
        repository: hgiang25/odoo-cmc-gitops
        token: ${{ secrets.GITOPS_PAT }}
        path: gitops-repo
        ref: dev
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: gitops-repo/requirements-tools.txt
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.32.7

    - name: Update and validate desired state
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        SOURCE_REPO: https://github.com/${{ github.repository }}.git
      run: |
        set -euo pipefail
        latest="$(git ls-remote "$SOURCE_REPO" refs/heads/main | cut -f1)"
        test "$latest" = "$GITHUB_SHA" || { echo 'Source main advanced; refusing stale Dev promotion.' >&2; exit 1; }
        python -m pip install -r gitops-repo/requirements-tools.txt
        python gitops-repo/scripts/update_images.py --username "$DOCKERHUB_USERNAME" --tag "$IMAGE_TAG" --file gitops-repo/overlays/dev/kustomization.yaml
        python gitops-repo/validate.py
        kubectl kustomize gitops-repo/overlays/dev >/dev/null

    - name: Commit and push the promotion
      working-directory: gitops-repo
      run: |
        set -euo pipefail
        if git diff --quiet -- overlays/dev/kustomization.yaml; then
          echo "Desired images already use $IMAGE_TAG"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add overlays/dev/kustomization.yaml
        git commit -m "chore(gitops): promote Dev Odoo images to $IMAGE_TAG from erp-odoo-cmccloud@${{ github.sha }}"
        python scripts/push_gitops.py --branch dev
    - name: Request controlled Dev deployment after promotion
      if: vars.CMC_AUTO_DEPLOY_DEV == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITOPS_PAT }}
      run: |
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/hgiang25/odoo-cmc-gitops/dispatches \
          --data "{\"event_type\":\"deploy-dev-release\",\"client_payload\":{\"environment\":\"dev\",\"image_tag\":\"$IMAGE_TAG\"}}"
